<html>
<head>
<title>Employee Registration</title>
</head>
<body>

<h1 align="center">
<img src="employee.png" height="50">
<font color="red">Employee Registration Form</font>
</h1>

<form>

<input type="radio" name="title"> Mr.
<input type="radio" name="title"> Mrs.
<input type="radio" name="title"> Ms.
<br><br>

First Name:
<input type="text" placeholder="First Name"><br><br>

Last Name:
<input type="text" placeholder="Last Name"><br><br>

Mail Address1:
<input type="text"><br><br>

Mail Address2:
<input type="text"><br><br>

City:
<input type="text"><br><br>

State:
<select>
<option>Gujarat</option>
<option>Maharashtra</option>
<option>Rajasthan</option>
<option>Uttrakhand</option>
</select><br><br>

Zip:
<input type="text"><br><br>

Upload Photo:
<input type="file"><br><br>

E-Mail:
<input type="email"><br><br>

Mobile:
<input type="text" value="+91"><br><br>

Languages known:<br>
<input type="checkbox"> Gujarati<br>
<input type="checkbox"> Hindi<br>
<input type="checkbox"> English<br>
<input type="checkbox"> Marathi<br><br>

Additional Information:<br>
<textarea rows="4" cols="40">Optional</textarea><br><br>

<input type="submit" value="submit">
<input type="reset" value="reset">

</form>

</body>
</html>
